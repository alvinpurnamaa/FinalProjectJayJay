name: Automation Test (API + Web)

on:
  push:
    branches: [ "main" ]

jobs:

  api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: chmod +x gradlew

      - run: ./gradlew apiTest

      - name: Upload API Cucumber Report
        uses: actions/upload-artifact@v4
        with:
          name: api-cucumber-report
          path: reports/api-report.html

  web-test:
    runs-on: ubuntu-latest
    needs: api-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: browser-actions/setup-chrome@v1

      - run: chmod +x gradlew

      - run: ./gradlew webTest

      - name: Upload Web Cucumber Report
        uses: actions/upload-artifact@v4
        with:
          name: web-cucumber-report
          path: reports/web-report.html
